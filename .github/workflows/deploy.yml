# verification marker
name: Deploy sites

# The four sites are static and are deployed to Netlify through the Netlify
# API, using deploy.py. The QA gate runs BEFORE any deploy, so a build that
# breaks a link, drops a heading or loses a canonical URL never reaches
# production.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Netlify credential reaches the runner as a repository secret. The
# GitHub credential used to push this file is served by the host's git
# credential helper and the macOS keychain — never in a remote URL.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build all four sites
        run: |
          python3.12 build_all.py
          python3.12 netlify_config.py

      - name: QA the built output
        # Link integrity, heading structure, metadata and sitemap consistency,
        # checked against the built output rather than the source. A failure
        # here stops the deploy.
        run: python3.12 qa.py

      - name: Check the contrast of the built tokens
        # Measures every semantic token pair in the BUILT css against the
        # WCAG 2.2 threshold, resolving the custom properties through the
        # real cascade. It reads the stylesheets the built page loads, so
        # a value the browser never uses cannot be measured. A missing
        # or unbuilt site fails rather than being skipped: a check that
        # cannot fail is not a check.
        run: python3.12 contrast.py

      - name: Check the shipped JavaScript parses
        # site.js shipped with an unclosed `if` block, so the browser
        # rejected the whole file and the theme toggle and the mobile
        # navigation did nothing on every page of every site. Nothing in
        # the QA gate looked at JavaScript, so the build stayed green.
        run: python3.12 test_javascript.py

      - name: Prove the checks can fail
        # A check that cannot fail is not a check. The brand guard in
        # qa.py is what stops AWARE's mark being served on goodciso.org
        # again, as it was from 2026-11-16 to 2026-11-18. The component-spec
        # check is what stops a component shipping with no specification,
        # as four did on the previous site. These steps break each guarded
        # condition in turn and assert the guard fires, so neither guard can
        # silently stop guarding.
        run: |
          python3.12 test_brand_guard.py
          python3.12 test_component_spec.py

      - name: Record the build in the job summary
        if: always()
        run: |
          {
            echo "### Build"
            echo ""
            echo "| Site | Pages |"
            echo "|---|---|"
            for site in aware corporate docs demo; do
              pages=$(find "dist/$site" -name '*.html' | wc -l | tr -d ' ')
              echo "| $site | $pages |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sites
          path: |
            dist/
            .deploy-hashes/
          retention-days: 7
          # v4 excludes hidden files by default, and .deploy-hashes/ is one.
          include-hidden-files: true

      - name: Decide which sites changed
        id: plan
        run: |
          # Only the sites whose built output actually changed need a
          # deploy. Comparing content hashes keeps an unrelated commit from
          # rebuilding all four sites.
          #
          # The directory does not exist in a fresh checkout, and a site
          # with no recorded hash has never been deployed, so it counts as
          # changed.
          mkdir -p .deploy-hashes
          changed=""
          for site in aware corporate docs demo; do
            hash=$(find "dist/$site" -type f -not -name ".*" -exec sha256sum {} \; | sort | sha256sum | cut -c1-16)
            previous=$(cat ".deploy-hashes/$site" 2>/dev/null || echo "")
            if [ "$hash" != "$previous" ]; then
              changed="$changed $site"
              echo "$hash" > ".deploy-hashes/$site"
            fi
          done
          echo "deploy=$changed" >> "$GITHUB_OUTPUT"
          echo "Sites to deploy:${changed:- none}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Nothing to deploy if no site's content changed.
    if: ${{ needs.build.outputs.deploy != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the built sites
        uses: actions/download-artifact@v4
        with:
          name: sites
          path: .
          # The artifact carries dist/ and .deploy-hashes/, so extract into
          # the workspace root rather than into a subdirectory.

      - name: Install the Netlify CLI
        # deploy.py deploys through the CLI, not the API: the API's zip
        # deploy silently drops Netlify Functions. A zip containing
        # netlify/functions/analytics.mjs produced "No functions deployed"
        # while the deploy reported success - so the collector would have
        # quietly not existed, and nothing in the build would have said so.
        run: npm install -g netlify-cli@26

      - name: Deploy to Netlify
        env:
          # The Netlify credential for the account that owns all four sites.
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # The CLI reads the token from the environment; it also takes it
          # as --auth. Both are set so it cannot fall back to an
          # interactive login, which would hang the runner.
          export NETLIFY_AUTH_TOKEN
          failed=""
          for site in ${{ needs.build.outputs.deploy }}; do
            echo "--- $site ---"
            if ! python3.12 deploy.py --site "$site"; then
              echo "::error::$site deploy failed"
              failed="$failed $site"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed sites:$failed"
            exit 1
          fi

      - name: Record the deploy hashes
        run: |
          mkdir -p .deploy-hashes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .deploy-hashes
          git commit -m "chore: record deploy content hashes" || echo "nothing to record"
          git push || echo "hashes not pushed"

      - name: Verify production
        # The same verifier used locally. It checks TLS, security headers,
        # robots, sitemaps and that every sitemap URL resolves.
        run: python3.12 verify_production.py

      - name: Verify the analytics collector is mounted
        # A GET on the function must answer 405, which proves it is
        # mounted. A 404 proves it is not, and a 404 is exactly what the
        # API's zip deploy produced while reporting success.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          failed=""
          for host in goodciso.org aware.goodciso.org docs.aware.goodciso.org demo.aware.goodciso.org; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://$host/.netlify/functions/analytics")
            echo "$host -> $code"
            if [ "$code" != "405" ]; then
              echo "::error::$host has no analytics function mounted (HTTP $code, expected 405)"
              failed="$failed $host"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::the collector is not mounted on:$failed"
            exit 1
          fi
